name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5433/arca
      INTERNAL_API_KEY: ci-internal-key-not-for-deployment
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: arca
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Crear .env de desarrollo
        run: npm run env:init

      - name: Crear schemas
        run: npm run db:schemas

      - name: Aplicar migraciones
        run: npm run db:migrate

      - name: Cargar semilla
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Pruebas
        run: npm test
