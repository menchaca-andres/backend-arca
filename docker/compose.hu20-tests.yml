# Base descartable de HU-20. No usa volumenes ni configuracion privada de otros proyectos.
name: arca-hu20-tests
services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_DB: arca_hu20_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hu20_local_test_only
    ports:
      - "127.0.0.1:55420:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arca_hu20_test"]
      interval: 3s
      timeout: 3s
      retries: 20
