    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "code",
          "message",
          "details"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "details": {
            "nullable": true
          }
        }
      },
      "CrearConcepto": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "codigo",
          "nombre",
          "tipo",
          "formaCalculo",
          "valor",
          "base",
          "automatico",
          "orden"
        ],
        "properties": {
          "codigo": {
            "type": "string",
            "minLength": 1,
            "maxLength": 20,
            "pattern": "^[A-Za-z0-9_-]+$"
          },
          "nombre": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "tipo": {
            "type": "string",
            "enum": [
              "HABER",
              "DESCUENTO"
            ]
          },
          "formaCalculo": {
            "type": "string",
            "enum": [
              "MONTO_FIJO",
              "PORCENTAJE"
            ]
          },
          "valor": {
            "type": "number",
            "minimum": 0,
            "maximum": 99999999.9999,
            "multipleOf": 0.0001
          },
          "base": {
            "type": "string",
            "nullable": true,
            "enum": [
              "HABER_BASICO",
              "TOTAL_GANADO",
              null
            ]
          },
          "automatico": {
            "type": "boolean"
          },
          "orden": {
            "type": "integer",
            "minimum": 0,
            "maximum": 32767
          }
        },
        "oneOf": [
          {
            "properties": {
              "formaCalculo": {
                "enum": [
                  "PORCENTAJE"
                ]
              },
              "valor": {
                "minimum": 0,
                "maximum": 100
              },
              "base": {
                "type": "string",
                "nullable": false,
                "enum": [
                  "HABER_BASICO",
                  "TOTAL_GANADO"
                ]
              }
            }
          },
          {
            "properties": {
              "formaCalculo": {
                "enum": [
                  "MONTO_FIJO"
                ]
              },
              "valor": {
                "minimum": 0,
                "exclusiveMinimum": true
              },
              "base": {
                "type": "string",
                "nullable": true,
                "enum": [
                  null
                ]
              }
            }
          }
        ]
      },
