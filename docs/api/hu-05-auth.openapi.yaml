openapi: 3.0.3
info:
  title: API pública – Autenticación (HU-05)
  version: 0.1.0
  description: |
    Endpoints de login y sesión expuestos por el API Gateway.
    El resto de las rutas /api requieren el mismo Bearer token.
servers:
  - url: http://localhost:8080
    description: API Gateway (desarrollo)
paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: Inicia sesión y devuelve un JWT de 8 h
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Credenciales correctas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423': { $ref: '#/components/responses/Locked' }
  /api/auth/me:
    get:
      tags: [auth]
      summary: Devuelve la identidad del token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Identidad del usuario autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Identidad' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: rrhh@arca.bo }
        password: { type: string, minLength: 1, maxLength: 200, example: Rrhh123! }
    LoginResponse:
      type: object
      required: [token, usuario]
      properties:
        token: { type: string, description: JWT HS256 con sub, rol e id_funcionario; vence en 8 h }
        usuario: { $ref: '#/components/schemas/UsuarioSesion' }
    UsuarioSesion:
      type: object
      required: [id, email, rol, funcionarioId]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        rol: { type: string, enum: [ADMIN, RRHH, DIRECCION, FUNCIONARIO] }
        funcionarioId: { type: string, format: uuid, nullable: true }
    Identidad:
      type: object
      required: [id, rol, funcionarioId]
      properties:
        id: { type: string, format: uuid }
        rol: { type: string, enum: [ADMIN, RRHH, DIRECCION, FUNCIONARIO] }
        funcionarioId: { type: string, format: uuid, nullable: true }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: UNAUTHORIZED }
        message: { type: string }
        details:
          nullable: true
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
  responses:
    ValidationError:
      description: Datos inválidos (code VALIDATION_ERROR)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Sin token, token vencido o credenciales inválidas (code UNAUTHORIZED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Locked:
      description: Cuenta bloqueada temporalmente (code ACCOUNT_LOCKED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
